<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div style="width: 40px;"></div>
            <h1>TechKeeper</h1>
            <div style="width: 40px;"></div>
        </header>

        <main class="auth-container">
            <div id="signin-form">
                <div class="auth-logo">
                    <i class="fas fa-home"></i>
                </div>
                <h2 style="text-align: center; margin-bottom: 2rem;">Welcome Back</h2>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••">
                </div>

                <button class="btn-action" style="margin-top: 1rem;" onclick="location.href='index.html'">
                    Sign In
                </button>

                <p class="auth-switch">
                    Don't have an account? <span onclick="toggleAuth()">Sign Up</span>
                </p>
            </div>

            <div id="signup-form" style="display: none;">
                <div class="auth-logo">
                    <i class="fas fa-home"></i>
                </div>
                <h2 style="text-align: center; margin-bottom: 2rem;">Create Account</h2>
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••">
                </div>

                <button class="btn-action" style="margin-top: 1rem;" onclick="location.href='index.html'">
                    Create Account
                </button>

                <p class="auth-switch">
                    Already have an account? <span onclick="toggleAuth()">Sign In</span>
                </p>
            </div>
        </main>
    </div>

    <script>
        function toggleAuth() {
            const signin = document.getElementById('signin-form');
            const signup = document.getElementById('signup-form');
            if (signin.style.display === 'none') {
                signin.style.display = 'block';
                signup.style.display = 'none';
            } else {
                signin.style.display = 'none';
                signup.style.display = 'block';
            }
        }
    </script>
</body>
</html>
