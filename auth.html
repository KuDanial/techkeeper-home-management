<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div style="width: 40px;"></div>
            <h1>TechKeeper</h1>
            <div style="width: 40px;"></div>
        </header>

        <main class="auth-container">
            <div class="auth-logo">
                <img src="techkeeper_logo.png" alt="TechKeeper Logo" style="max-width: 100%; height: auto; width: 120px;">
            </div>
            
            <h3 style="text-align: center; color: var(--text-dark); margin-bottom: 0.5rem; font-size: 1rem;">Log In</h3>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@example.com" id="emailInput">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" id="passwordInput">
            </div>

            <button class="btn-action" style="margin-top: 1rem;" onclick="handleLogin()">
                Sign In
            </button>

            <p class="auth-switch">
                Don't have an account? <a href="signup.html" style="color: var(--primary-accent); text-decoration: none; font-weight: 600;">Sign Up</a>
            </p>
        </main>
    </div>

    <script>
        function handleLogin() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }
            
            if (!email.includes('@')) {
                alert('Please enter a valid email address');
                return;
            }
            
            location.href = 'index.html';
        }
    </script>
</body>
</html>
