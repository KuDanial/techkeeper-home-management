<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Create Account</h1>
            <div style="width: 40px;"></div>
        </header>

        <main class="auth-container" style="padding: 1.5rem;">
            <div class="auth-logo">
                <img src="techkeeper_logo.png" alt="TechKeeper Logo" style="max-width: 100%; height: auto; width: 120px;">
            </div>
            
            <h3 style="text-align: center; color: var(--text-dark); margin-bottom: 0.5rem; font-size: 1rem;">Create Your Account</h3>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <!-- Personal Information Section -->
                <h4 style="font-size: 0.9rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 1rem; margin-top: 0.5rem;">Personal Information</h4>
                
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="fullName" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label>Username *</label>
                    <input type="text" id="username" placeholder="johndoe123" required>
                    <small style="color: var(--text-gray); font-size: 0.75rem; margin-top: 4px;">3-20 characters, letters and numbers only</small>
                </div>

                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" id="phone" placeholder="(555) 123-4567" required>
                </div>

                <!-- Address Section -->
                <h4 style="font-size: 0.9rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 1rem; margin-top: 1.5rem;">Home Address</h4>

                <div class="form-group">
                    <label>Street Address *</label>
                    <input type="text" id="address" placeholder="No. 15, Jalan Ara" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>City/Suburb *</label>
                        <input type="text" id="city" placeholder="Bangsar" required>
                    </div>
                    <div class="form-group">
                        <label>State/WP</label>
                        <input type="text" id="state" placeholder="Kuala Lumpur">
                    </div>
                </div>

                <!-- Security Section -->
                <h4 style="font-size: 0.9rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 1rem; margin-top: 1.5rem;">Security</h4>

                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <small style="color: var(--text-gray); font-size: 0.75rem; margin-top: 4px;">At least 8 characters</small>
                </div>

                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>

                <!-- Terms & Conditions -->
                <div style="margin: 1.5rem 0; padding: 1rem; background: var(--bg-light); border-radius: 8px;">
                    <div style="display: flex; gap: 10px; align-items: flex-start;">
                        <input type="checkbox" id="terms" required style="margin-top: 4px; cursor: pointer;">
                        <label for="terms" style="font-size: 0.85rem; cursor: pointer; margin: 0;">
                            I agree to the <a href="terms.html" style="color: var(--primary-accent); text-decoration: none;">Terms of Service</a> and <a href="privacy.html" style="color: var(--primary-accent); text-decoration: none;">Privacy Policy</a>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-action" style="margin-top: 1rem;">
                    Create Account
                </button>

                <p class="auth-switch">
                    Already have an account? <a href="auth.html" style="color: var(--primary-accent); text-decoration: none; font-weight: 600;">Sign In</a>
                </p>
            </form>
        </main>
    </div>

    <script>
        function handleSignup(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const city = document.getElementById('city').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const termsAccepted = document.getElementById('terms').checked;

            // Validation
            if (!fullName || !username || !email || !phone || !address || !city || !password || !confirmPassword) {
                alert('Please fill in all required fields');
                return;
            }

            if (fullName.length < 2) {
                alert('Full name must be at least 2 characters');
                return;
            }

            if (username.length < 3 || username.length > 20) {
                alert('Username must be 3-20 characters');
                return;
            }

            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                alert('Username can only contain letters, numbers, and underscores');
                return;
            }

            if (!email.includes('@')) {
                alert('Please enter a valid email address');
                return;
            }

            if (password.length < 8) {
                alert('Password must be at least 8 characters');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }

            if (!termsAccepted) {
                alert('Please accept the terms and conditions');
                return;
            }

            // If all validations pass
            alert('Account created successfully! Welcome to TechKeeper!');
            location.href = 'index.html';
        }
    </script>
</body>
</html>
