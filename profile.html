<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>My Profile</h1>
            <div style="width: 40px;"></div>
        </header>

        <main class="content-area">
            <div style="display: flex; flex-direction: column; align-items: center; padding: 2rem 0;">
                <div style="width: 100px; height: 100px; background: var(--primary-accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem;">
                    H
                </div>
                <h2 style="font-size: 1.25rem;">Tengku Danial</h2>
                <p class="text-gray text-sm">tengkuahmaddanial420@gmail.com</p>
                <button class="btn" style="margin-top: 1rem; border: 1px solid var(--primary-accent); color: var(--primary-accent); background: transparent; padding: 0.5rem 1.5rem;" onclick="location.href='profile-edit.html'">Edit Profile</button>
            </div>

            <h3 class="form-section-title">Home Information</h3>
            <div class="card" style="padding: 1rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <div>
                        <p class="text-xs text-gray">Primary Address</p>
                        <p class="text-sm">No. 15, Jalan Ara, Bangsar, 59100 Kuala Lumpur</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray"></i>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <p class="text-xs text-gray">Home Type</p>
                        <p class="text-sm">Single Family Detached</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray"></i>
                </div>
            </div>

            <h3 class="form-section-title">Account Settings</h3>
            <div class="category-list" style="border-radius: 12px; overflow: hidden;">
                <a href="notifications.html" class="category-item">
                    <div class="category-icon" style="font-size: 1.1rem;"><i class="fas fa-bell"></i></div>
                    <div class="category-text"><h4 class="text-sm">Notifications</h4></div>
                    <i class="fas fa-chevron-right text-gray"></i>
                </a>
                <a href="security.html" class="category-item">
                    <div class="category-icon" style="font-size: 1.1rem;"><i class="fas fa-shield-alt"></i></div>
                    <div class="category-text"><h4 class="text-sm">Privacy & Security</h4></div>
                    <i class="fas fa-chevron-right text-gray"></i>
                </a>
                <a href="auth.html" class="category-item">
                    <div class="category-icon" style="font-size: 1.1rem; color: #e74c3c;"><i class="fas fa-sign-out-alt"></i></div>
                    <div class="category-text"><h4 class="text-sm" style="color: #e74c3c;">Log Out</h4></div>
                </a>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
