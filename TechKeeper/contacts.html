<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn"><i class="fas fa-bars"></i></button>
            <h1>Contacts</h1>
            <button class="icon-btn"><i class="far fa-user"></i></button>
        </header>

        <div class="search-container">
            <div class="search-bar">
                <i class="fas fa-search text-gray"></i>
                <input type="text" placeholder="Search ...">
            </div>
        </div>

        <main class="content-area" style="padding: 0;">
            <div class="category-list">
                <!-- Contact 1 -->
                <a href="contact-details.html" class="category-item">
                    <div class="contact-avatar">A</div>
                    <div class="category-text">
                        <h4 class="text-sm">Atlas Water</h4>
                        <p class="text-xs text-gray">Plumbing</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray"></i>
                </a>

                <!-- Contact 2 -->
                <a href="#" class="category-item">
                    <div class="contact-avatar">C</div>
                    <div class="category-text">
                        <h4 class="text-sm">Castle Tile</h4>
                        <p class="text-xs text-gray">Ceramic Tile</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray"></i>
                </a>

                <!-- Contact 3 -->
                <a href="#" class="category-item">
                    <div class="contact-avatar">D</div>
                    <div class="category-text">
                        <h4 class="text-sm">Don Smith Construction</h4>
                        <p class="text-xs text-gray">Vinyl Siding & Gutters</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray"></i>
                </a>

                <!-- Contact 4 -->
                <a href="#" class="category-item">
                    <div class="contact-avatar">E</div>
                    <div class="category-text">
                        <h4 class="text-sm">Electric Circuit</h4>
                        <p class="text-xs text-gray">Appliance Repair & Install</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray"></i>
                </a>

                <!-- Contact 5 -->
                <a href="#" class="category-item">
                    <div class="contact-avatar">F</div>
                    <div class="category-text">
                        <h4 class="text-sm">Falcon Heating</h4>
                        <p class="text-xs text-gray">HVAC</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray"></i>
                </a>
            </div>
        </main>

        <div class="fixed-action-container">
            <button class="btn-action">
                Add New Contact
            </button>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Maintain</span>
            </a>
            <a href="catalog.html" class="nav-item">
                <i class="fas fa-th-large"></i>
                <span>Catalog</span>
            </a>
            <a href="contacts.html" class="nav-item">
                <i class="fas fa-address-book"></i>
                <span>Contacts</span>
            </a>
            <a href="support.html" class="nav-item">
                <i class="fas fa-headset"></i>
                <span>Support</span>
            </a>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
