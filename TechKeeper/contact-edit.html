<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Contact - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Edit Contact</h1>
            <div style="width: 40px;"></div>
        </header>

        <main class="content-area">
            <div style="display: flex; flex-direction: column; align-items: center; padding: 1.5rem 0;">
                <div class="contact-avatar" style="width: 80px; height: 80px; font-size: 2rem;">A</div>
            </div>

            <h3 class="form-section-title">Business Information</h3>
            
            <div class="form-group">
                <label>Business Name</label>
                <input type="text" value="Atlas Water">
            </div>

            <div class="form-group">
                <label>Service Type</label>
                <input type="text" value="Plumbing">
            </div>

            <h3 class="form-section-title">Contact Details</h3>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" value="(555) 123-4567">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" value="support@atlaswater.com">
            </div>

            <div class="form-group">
                <label>Website</label>
                <input type="url" value="www.atlaswater.com">
            </div>

            <h3 class="form-section-title">Notes</h3>
            <div class="form-group">
                <textarea rows="4" style="padding: 0.85rem; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; font-family: inherit;">Specializes in emergency leak repair and water filtration systems.</textarea>
            </div>
        </main>

        <div class="fixed-action-container">
            <button class="btn-action" onclick="alert('Contact updated successfully!'); history.back();">
                Save Changes
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
