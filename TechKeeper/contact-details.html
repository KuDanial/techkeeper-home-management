<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Info - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Atlas Water</h1>
            <button class="icon-btn" onclick="location.href='contact-edit.html'"><i class="fas fa-edit"></i></button>
        </header>

        <main class="content-area">
            <div style="display: flex; flex-direction: column; align-items: center; padding: 2rem 0;">
                <div class="contact-avatar" style="width: 80px; height: 80px; font-size: 2rem; margin-bottom: 1rem;">A</div>
                <h2>Atlas Water</h2>
                <p class="text-gray">Plumbing Services</p>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 2rem;">
                <button class="btn-action" style="flex: 1; background: #3498db;"><i class="fas fa-phone"></i> Call</button>
                <button class="btn-action" style="flex: 1; background: var(--primary-accent);"><i class="fas fa-envelope"></i> Email</button>
            </div>

            <h3 class="form-section-title">Contact Information</h3>
            <div class="card" style="padding: 1rem;">
                <div style="margin-bottom: 1rem;">
                    <p class="text-xs text-gray">Phone</p>
                    <p class="text-sm">(555) 123-4567</p>
                </div>
                <div style="margin-bottom: 1rem;">
                    <p class="text-xs text-gray">Email</p>
                    <p class="text-sm">support@atlaswater.com</p>
                </div>
                <div>
                    <p class="text-xs text-gray">Website</p>
                    <p class="text-sm">www.atlaswater.com</p>
                </div>
            </div>

            <h3 class="form-section-title">Past Work</h3>
            <div class="card" style="padding: 1rem;">
                <p class="text-sm">Fixed kitchen faucet leak - Mar 2026</p>
                <p class="text-xs text-gray">Total: $120.00</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
