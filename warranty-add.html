<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Warranty - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Add Warranty</h1>
            <div style="width: 40px;"></div>
        </header>

        <main class="content-area">
            <div style="display: flex; flex-direction: column; align-items: center; padding: 1.5rem 0;">
                <div class="photo-upload-placeholder" style="width: 80px; height: 80px; border-radius: 50%; margin-bottom: 1rem;">
                    <i class="fas fa-camera"></i>
                </div>
                <p class="text-xs text-gray">Upload policy photo</p>
            </div>

            <h3 class="form-section-title">Coverage Details</h3>
            
            <div class="form-group">
                <label>Provider Name</label>
                <input type="text" placeholder="e.g., Geek Squad Protection">
            </div>

            <div class="form-group">
                <label>Policy / Serial Number</label>
                <input type="text" placeholder="e.g., GSP-123456789">
            </div>

            <div class="form-group">
                <label>Start Date</label>
                <input type="date">
            </div>

            <div class="form-group">
                <label>End Date</label>
                <input type="date">
            </div>

            <h3 class="form-section-title">Coverage Terms</h3>
            <div class="form-group">
                <textarea rows="3" style="padding: 0.85rem; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; font-family: inherit;" placeholder="e.g., Parts and labor included..."></textarea>
            </div>
        </main>

        <div class="fixed-action-container">
            <button class="btn-action" onclick="validateAndSaveWarranty()">
                Add Warranty
            </button>
        </div>
    </div>

    <script>
        function validateAndSaveWarranty() {
            const providerName = document.querySelector('input[placeholder="e.g., Geek Squad Protection"]').value.trim();
            const policyNumber = document.querySelector('input[placeholder="e.g., GSP-123456789"]').value.trim();
            const startDate = document.querySelector('input[type="date"]').value;
            const endDate = document.querySelectorAll('input[type="date"]')[1].value;
            
            if (!providerName) {
                alert('Please enter a provider name');
                return;
            }
            
            if (!policyNumber) {
                alert('Please enter a policy or serial number');
                return;
            }
            
            if (!startDate) {
                alert('Please select a start date');
                return;
            }
            
            if (!endDate) {
                alert('Please select an end date');
                return;
            }
            
            const start = new Date(startDate);
            const end = new Date(endDate);
            
            if (end <= start) {
                alert('End date must be after start date');
                return;
            }
            
            alert('Warranty added successfully!');
            history.back();
        }
    </script>
</body>
</html>
