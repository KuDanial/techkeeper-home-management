<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Warranty - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Edit Warranty</h1>
            <div style="width: 40px;"></div>
        </header>

        <main class="content-area">
            <h3 class="form-section-title">Coverage Details</h3>
            
            <div class="form-group">
                <label>Provider Name</label>
                <input type="text" placeholder="e.g., Samsung Manufacturer Warranty">
            </div>

            <div class="form-group">
                <label>Policy / Serial Number</label>
                <input type="text" placeholder="e.g., SAMP-990-221-X">
            </div>

            <div class="form-group">
                <label>Start Date</label>
                <input type="date">
            </div>

            <div class="form-group">
                <label>End Date</label>
                <input type="date">
            </div>

            <h3 class="form-section-title">Terms</h3>
            <div class="form-group">
                <textarea rows="4" style="padding: 0.85rem; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; font-family: inherit;" placeholder="Briefly describe what is covered..."></textarea>
            </div>
        </main>

        <div class="fixed-action-container">
            <button class="btn-action" onclick="alert('Warranty information saved!'); history.back();">
                Save Warranty Info
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
