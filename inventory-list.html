<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appliances - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Appliances</h1>
            <button class="icon-btn" onclick="location.href='add-item.html'"><i class="fas fa-plus"></i></button>
        </header>

        <main class="content-area">
            <h3 class="form-section-title">In this category</h3>
            
            <!-- Samsung Refrigerator -->
            <div class="card" style="padding: 1rem; margin-bottom: 1rem; cursor: pointer;" onclick="location.href='view-item.html'">
                <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 1rem;">
                    <img src="samsungfridge.png" style="width: 70px; height: 70px; border-radius: 8px; object-fit: cover;">
                    <div style="flex: 1;">
                        <h4 class="text-sm">Samsung Refrigerator</h4>
                        <p class="text-xs text-gray">Kitchen • Model: RF28R</p>
                        <span class="badge" style="margin-top: 5px; cursor: pointer;" onclick="event.stopPropagation(); location.href='warranty-details.html'">Active Warranty</span>
                    </div>
                </div>
                <div style="display: flex; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 10px;">
                    <button class="btn" style="flex: 1; font-size: 0.7rem; padding: 0.5rem; background: #EEE; color: var(--text-dark);" onclick="event.stopPropagation(); location.href='upload-document.html'"><i class="fas fa-upload"></i> Manual</button>
                    <button class="btn" style="flex: 1; font-size: 0.7rem; padding: 0.5rem; background: #EEE; color: var(--text-dark);" onclick="event.stopPropagation(); alert('Downloading manual...')"><i class="fas fa-download"></i> Manual</button>
                    <button class="btn" style="flex: 1; font-size: 0.7rem; padding: 0.5rem; border: 1px solid var(--primary-accent); background: transparent; color: var(--primary-accent);" onclick="event.stopPropagation(); alert('Maintenance guide coming soon for this item.')"><i class="fas fa-tools"></i> Guide</button>
                </div>
            </div>

            <!-- LG Dishwasher -->
            <div class="card" style="padding: 1rem; margin-bottom: 1rem; cursor: pointer;" onclick="location.href='view-item.html'">
                <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 1rem;">
                    <img src="lgdishwasher.png" style="width: 70px; height: 70px; border-radius: 8px; object-fit: cover;">
                    <div style="flex: 1;">
                        <h4 class="text-sm">LG Dishwasher</h4>
                        <p class="text-xs text-gray">Kitchen • Model: LDT780</p>
                        <span class="badge" style="margin-top: 5px; background: #EEE; color: var(--text-gray); cursor: pointer;" onclick="event.stopPropagation(); location.href='warranty-add.html'"><i class="fas fa-plus"></i> Add Warranty</span>
                    </div>
                </div>
                <div style="display: flex; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 10px;">
                    <button class="btn" style="flex: 1; font-size: 0.7rem; padding: 0.5rem; background: #EEE; color: var(--text-dark);" onclick="event.stopPropagation(); location.href='upload-document.html'"><i class="fas fa-upload"></i> Manual</button>
                    <button class="btn" style="flex: 1; font-size: 0.7rem; padding: 0.5rem; background: #EEE; color: var(--text-dark);" onclick="event.stopPropagation(); alert('Downloading manual...')"><i class="fas fa-download"></i> Manual</button>
                    <button class="btn" style="flex: 1; font-size: 0.7rem; padding: 0.5rem; border: 1px solid var(--primary-accent); background: transparent; color: var(--primary-accent);" onclick="event.stopPropagation(); location.href='educate.html'"><i class="fas fa-tools"></i> Guide</button>
                </div>
            </div>

            <!-- Whirlpool Microwave -->
            <div class="card" style="padding: 1rem; margin-bottom: 1rem; cursor: pointer;" onclick="location.href='view-item.html'">
                <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 1rem;">
                    <img src="whirlpoolmicrowave.png" style="width: 70px; height: 70px; border-radius: 8px; object-fit: cover;">
                    <div style="flex: 1;">
                        <h4 class="text-sm">Whirlpool Microwave</h4>
                        <p class="text-xs text-gray">Kitchen • Countertop</p>
                        <span class="badge" style="margin-top: 5px; background: #EEE; color: var(--text-gray); cursor: pointer;" onclick="event.stopPropagation(); location.href='warranty-add.html'"><i class="fas fa-plus"></i> Add Warranty</span>
                    </div>
                </div>
                <div style="display: flex; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 10px;">
                    <button class="btn" style="flex: 1; font-size: 0.7rem; padding: 0.5rem; background: #EEE; color: var(--text-dark);" onclick="event.stopPropagation(); location.href='upload-document.html'"><i class="fas fa-upload"></i> Manual</button>
                    <button class="btn" style="flex: 1; font-size: 0.7rem; padding: 0.5rem; background: #EEE; color: var(--text-dark);" onclick="event.stopPropagation(); alert('Downloading manual...')"><i class="fas fa-download"></i> Manual</button>
                    <button class="btn" style="flex: 1; font-size: 0.7rem; padding: 0.5rem; border: 1px solid var(--primary-accent); background: transparent; color: var(--primary-accent);" onclick="event.stopPropagation(); alert('Maintenance guide coming soon for this item.')"><i class="fas fa-tools"></i> Guide</button>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="catalog.html" class="nav-item">
                <i class="fas fa-th-large"></i>
                <span>Inventory</span>
            </a>
            <a href="contacts.html" class="nav-item">
                <i class="fas fa-address-book"></i>
                <span>Contacts</span>
            </a>
            <a href="support.html" class="nav-item">
                <i class="fas fa-headset"></i>
                <span>Help</span>
            </a>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
