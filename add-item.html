<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Add Item</h1>
            <div style="width: 40px;"></div>
        </header>

        <main class="content-area">
            <div class="photo-upload-placeholder">
                <i class="fas fa-camera" style="font-size: 2rem; margin-bottom: 10px;"></i>
                <span class="text-sm">Add Photos</span>
            </div>

            <h3 class="form-section-title">Item Details</h3>
            
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" placeholder="e.g., Refrigerator">
            </div>

            <div class="form-group">
                <label>Category</label>
                <select style="padding: 0.85rem; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; background: white;">
                    <option>Appliances</option>
                    <option>Door, Window & Garage</option>
                    <option>Exterior</option>
                    <option>Furniture</option>
                    <option>Heating & Cooling</option>
                    <option>Home Cosmetics</option>
                    <option>Plumbing</option>
                    <option>Electrical</option>
                    <option>Garden & Landscaping</option>
                    <option>Security Systems</option>
                </select>
            </div>

            <h3 class="form-section-title">Optional Info</h3>

            <div class="form-group">
                <label>Brand</label>
                <input type="text" placeholder="e.g., Samsung">
            </div>

            <div class="form-group">
                <label>Model Number</label>
                <input type="text" placeholder="e.g., RF28R7351SR">
            </div>

            <div class="form-group">
                <label>Purchase Date</label>
                <input type="date">
            </div>
        </main>

        <div class="fixed-action-container">
            <button class="btn-action" onclick="validateAndSaveItem()">
                Save Item
            </button>
        </div>
    </div>

    <script>
        function validateAndSaveItem() {
            const itemName = document.querySelector('input[placeholder="e.g., Refrigerator"]').value.trim();
            const category = document.querySelector('select').value;
            
            if (!itemName) {
                alert('Please enter an item name');
                return;
            }
            
            if (itemName.length < 2) {
                alert('Item name must be at least 2 characters');
                return;
            }
            
            alert('Item saved successfully!');
            history.back();
        }
    </script>
</body>
</html>
