<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Contact - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Add New Contact</h1>
            <div style="width: 40px;"></div>
        </header>

        <main class="content-area">
            <h3 class="form-section-title">Business Information</h3>
            
            <div class="form-group">
                <label>Business Name</label>
                <input type="text" placeholder="e.g., Smith Plumbing">
            </div>

            <div class="form-group">
                <label>Service Type</label>
                <input type="text" placeholder="e.g., Plumbing">
            </div>

            <h3 class="form-section-title">Contact Details</h3>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="(555) 000-0000">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="contact@example.com">
            </div>

            <div class="form-group">
                <label>Website (Optional)</label>
                <input type="url" placeholder="www.example.com">
            </div>

            <h3 class="form-section-title">Notes</h3>
            <div class="form-group">
                <textarea rows="4" style="padding: 0.85rem; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; font-family: inherit;" placeholder="Add any special instructions..."></textarea>
            </div>
        </main>

        <div class="fixed-action-container">
            <button class="btn-action" onclick="validateAndSaveContact()">
                Add Contact
            </button>
        </div>
    </div>

    <script>
        function validateAndSaveContact() {
            const businessName = document.querySelector('input[placeholder="e.g., Smith Plumbing"]').value.trim();
            const serviceType = document.querySelector('input[placeholder="e.g., Plumbing"]').value.trim();
            const phone = document.querySelector('input[placeholder="(555) 000-0000"]').value.trim();
            const email = document.querySelector('input[placeholder="contact@example.com"]').value.trim();
            
            if (!businessName) {
                alert('Please enter a business name');
                return;
            }
            
            if (!serviceType) {
                alert('Please enter a service type');
                return;
            }
            
            if (!phone) {
                alert('Please enter a phone number');
                return;
            }
            
            if (email && !email.includes('@')) {
                alert('Please enter a valid email address');
                return;
            }
            
            alert('Contact added successfully!');
            history.back();
        }
    </script>
</body>
</html>
