<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warranty Details - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Warranty Details</h1>
            <button class="icon-btn" onclick="location.href='warranty-edit.html'"><i class="fas fa-edit"></i></button>
        </header>

        <main class="content-area">
            <div style="display: flex; flex-direction: column; align-items: center; padding: 2rem 0;">
                <img src="samsungfridge.png" style="width: 100px; height: 100px; border-radius: 12px; object-fit: cover; margin-bottom: 1rem;">
                <h2>Samsung Refrigerator</h2>
                <span class="badge" style="background: var(--primary-accent); font-size: 0.8rem; padding: 0.4rem 1rem;">ACTIVE</span>
            </div>

            <h3 class="form-section-title">Coverage Information</h3>
            <div class="card" style="padding: 1rem;">
                <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between;">
                    <div>
                        <p class="text-xs text-gray">Provider</p>
                        <p class="text-sm">Samsung Manufacturer Warranty</p>
                    </div>
                </div>
                <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between;">
                    <div>
                        <p class="text-xs text-gray">Policy Number</p>
                        <p class="text-sm">SAMP-990-221-X</p>
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; gap: 20px;">
                    <div style="flex: 1;">
                        <p class="text-xs text-gray">Start Date</p>
                        <p class="text-sm">Jan 12, 2025</p>
                    </div>
                    <div style="flex: 1;">
                        <p class="text-xs text-gray">End Date</p>
                        <p class="text-sm">Jan 12, 2028</p>
                    </div>
                </div>
            </div>

            <h3 class="form-section-title">Documents</h3>
            <div class="card" style="padding: 1rem;">
                <div style="display: flex; align-items: center; gap: 15px;" onclick="location.href='documents.html'">
                    <i class="far fa-file-pdf" style="font-size: 1.5rem; color: #e74c3c;"></i>
                    <div style="flex: 1;">
                        <p class="text-sm">Samsung_Fridge_Warranty.pdf</p>
                        <p class="text-xs text-gray">1.1 MB</p>
                    </div>
                    <i class="fas fa-download text-gray"></i>
                </div>
            </div>

            <div style="margin-top: 2rem;">
                <button class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;" onclick="location.href='upload-document.html'">
                    Update Warranty Document
                </button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
