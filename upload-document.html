<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Document - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Upload Document</h1>
            <div style="width: 40px;"></div>
        </header>

        <main class="content-area">
            <div class="photo-upload-placeholder" style="height: 200px; border-style: solid; border-width: 1px;">
                <i class="fas fa-file-upload" style="font-size: 2.5rem; color: var(--primary-accent); margin-bottom: 15px;"></i>
                <p class="text-sm">Tap to select a file</p>
                <p class="text-xs text-gray">PDF, JPG, or PNG (Max 10MB)</p>
            </div>

            <h3 class="form-section-title">Document Details</h3>
            
            <div class="form-group">
                <label>Document Name</label>
                <input type="text" placeholder="e.g., Kitchen Remodel Receipt">
            </div>

            <div class="form-group">
                <label>Type</label>
                <select style="padding: 0.85rem; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; background: white;">
                    <option>Manual / Guide</option>
                    <option>Warranty</option>
                    <option>Receipt / Invoice</option>
                    <option>Insurance Policy</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Link to Item (Optional)</label>
                <select style="padding: 0.85rem; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; background: white;">
                    <option>None</option>
                    <option>Samsung Refrigerator</option>
                    <option>LG Dishwasher</option>
                    <option>Whirlpool Microwave</option>
                </select>
            </div>
        </main>

        <div class="fixed-action-container">
            <button class="btn-action" onclick="alert('Document uploaded successfully!'); location.href='documents.html';">
                Confirm Upload
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
