<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy & Security - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Privacy & Security</h1>
            <div style="width: 40px;"></div>
        </header>

        <main class="content-area">
            <h3 class="form-section-title">Login Security</h3>
            <div class="category-list" style="border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem;">
                <a href="#" class="category-item" onclick="alert('Change Password feature coming soon!'); return false;">
                    <div class="category-text"><h4 class="text-sm">Change Password</h4></div>
                    <i class="fas fa-chevron-right text-gray"></i>
                </a>
                <div class="category-item">
                    <div class="category-text"><h4 class="text-sm">Two-Factor Auth</h4></div>
                    <span class="text-xs text-accent">Enabled</span>
                </div>
            </div>

            <h3 class="form-section-title">Data Privacy</h3>
            <div class="category-list" style="border-radius: 12px; overflow: hidden;">
                <div class="category-item">
                    <div class="category-text">
                        <h4 class="text-sm">Share Maintenance Data</h4>
                        <p class="text-xs text-gray">Share status with service pros</p>
                    </div>
                    <input type="checkbox" checked style="width: 40px; height: 20px;">
                </div>
                <a href="#" class="category-item" onclick="if(confirm('Are you sure you want to delete your account? This cannot be undone.')) { alert('Account deletion initiated. You will receive a confirmation email.'); } return false;">
                    <div class="category-text"><h4 class="text-sm" style="color: #e74c3c;">Delete Account</h4></div>
                </a>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
