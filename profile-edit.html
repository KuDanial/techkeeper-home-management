<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - TechKeeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Edit Profile</h1>
            <div style="width: 40px;"></div>
        </header>

        <main class="content-area">
            <div style="display: flex; flex-direction: column; align-items: center; padding: 1.5rem 0;">
                <div style="position: relative;">
                    <div style="width: 90px; height: 90px; background: var(--primary-accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 2.2rem; font-weight: 700;">H</div>
                    <div style="position: absolute; bottom: 0; right: 0; background: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color);">
                        <i class="fas fa-camera" style="font-size: 0.8rem; color: var(--text-gray);"></i>
                    </div>
                </div>
            </div>

            <h3 class="form-section-title">Personal Info</h3>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" value="Tengku Ahmad Danial Bin Tengku Noor Ashraf">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" value="tengku_danial">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" value="tengkuahmaddanial420@gmail.com">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" value="(555) 123-4567">
            </div>

            <h3 class="form-section-title">Home Address</h3>
            <div class="form-group">
                <label>Street Address</label>
                <input type="text" value="No. 15, Jalan Ara">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>City/Suburb</label>
                    <input type="text" value="Bangsar">
                </div>
                <div class="form-group">
                    <label>State/WP</label>
                    <input type="text" value="Kuala Lumpur">
                </div>
            </div>

            <h3 class="form-section-title">Home Details</h3>
            <div class="form-group">
                <label>Home Type</label>
                <select style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; background: white;">
                    <option value="single">Single Family Detached</option>
                    <option value="townhouse">Townhouse</option>
                    <option value="condo">Condominium</option>
                    <option value="apartment">Apartment</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </main>

        <div class="fixed-action-container">
            <button class="btn-action" onclick="alert('Profile updated!'); history.back();">
                Save Changes
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
